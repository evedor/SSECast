### base config ###
# 数据集：Data/（原始 Data/cascadia/slip_potency_smooth；Data_slip_potency_20261028 为另一版产品）
full_field: &FULL_FIELD
  run_num: "00"
  exper_path: "./Results/cascadia"
  data_path: "../data/cascadia/slip_potency_smooth"
  fault_path: "../data/cascadia/fault"
  tremor_path: "../data/cascadia/tremor"
  llh_path: "../data/cascadia/fault/llh"
  mean_path: "../data/cascadia/norm_value/mean.npy"
  std_path: "../data/cascadia/norm_value/std.npy"
  device: "cuda"
  use_tremor: !!bool False
  early_stopping_patience: 40
  batch_size: 48
  dt: 1
  lr:  0.0005
  max_epochs: 100
  img_size: 3339
  patch_size: 2          
  token_pairing: "diagonal"  # diagonal(共斜边配对成四边形，再把相邻四边形合并) / phase(条带内按相位切块)
  # ---- token 边界对齐到断层的“沿倾角条带”结构（见 utils/fault_tokens.py）----
  align_tokens: !!bool True
  # align_tokens：diagonal 模式按网格配对；phase 模式按条带相位切块
  token_jump_km: 30        # 相邻单元质心距离 > 该值 视为条带边界
  token_order: "strip"        # token 编号顺序：strip(按条带依次) / serpentine(蛇形) / raster(纬度优先栅格)
  # ---- 位置编码（二维几何平滑）----
  pos_embed_mode: "grid"      # table(每个 token 一个可学习向量) / grid(二维网格 + 双线性插值)
  pos_coord_mode: "lonlat"    # grid 的坐标：lonlat(token 平均经纬度) / uv(沿倾角弧长, 条带号)
  # (H, W) 按物理长宽比选：cascadia ≈ 514 km(经, 已含 cos lat) × 1242 km(纬) → 48×24 ≈ 22×26 km/格
  pos_grid_lat: 48            # lonlat 模式：纬度方向网格数（行 = y）
  pos_grid_lon: 24            # lonlat 模式：经度方向网格数（列 = x）
  pos_grid_v: 72              # uv 模式：沿走向网格数（≈ 条带数）
  pos_grid_u: 24              # uv 模式：沿倾角网格数
  fea_len: 3339

  # ---- 输入 / 输出时间窗（2026-11-04 改：2 天输入 -> 预测第 3 天 -> 用第 2 天+预测的第 3 天 预测第 4 天）----
  time_chans: 2          # 输入窗口长度(天)：用过去 2 天
  data_chans: 3          # 每天的物理/数据通道数
  block_len: 1           # 一次前向只预测 1 天（自回归迭代）
  n_blocks: 2            # 训练时滚 2 步：第 3 天 + 第 4 天
  rollout_horizon: 2     # 训练标签天数 = block_len * n_blocks = 2
  out_chans: 3           # 输出通道数 = block_len * data_chans = 1*3
  # ---- 增量预测（避免模型退化成“复制最后一天”）----
  predict_delta: !!bool True    # 模型只输出 Δ，绝对场 = 输入窗最后一天 + Δ（= persistence 锚点，见 networks/model.py:613）
  delta_weight: 2            # 增量项权重：L = L_abs(相对) + delta_weight * L_delta(相对，分母=绝对场幅度)
  loss_mode: "l1"             # l1(加权相对 L1，重尾/突变更友好) / l2(原实现)
  # ---- 目标形态：逐日 / 多个滑动平均窗 ----
  target_mode: "next_day"      # next_day(逐日自回归) / multi_window(重叠滑窗平均)
  target_window: 5             # 每个窗口的平均天数

  # ---- 高价值区(SSE)加权：原有按深度的加权不变，mask 内的单元权重再 ×mask_boost ----
  mask_path: "../data/high_value_masks.npz"
  mask_key: "cascadia"      # 留空/删掉则默认用区域名(cascadia/alaska/nankai/newzealand)
  mask_boost: 1.0           # mask 区权重倍数；1.0 = 关闭（等于改造前的纯深度加权）

# 训练基础模型
backbone: &backbone
  <<: *FULL_FIELD
  run_num: "00"
  two_step_training: !!bool True      # True: 训练两步(第 3 天 + 第 4 天)
  checkpoint_path: "./Results/cascadia/00/training_checkpoints/backbone.ckpt"
  best_checkpoint_path: "./Results/cascadia/00/training_checkpoints/best_model.ckpt"
  writer: "./Results/cascadia/00/tensorboard"

# 微调有tremor数据的模型，直接使用迭代微调的方式
tremor_finetune:
  <<: *FULL_FIELD
  run_num: "22"
  data_chans: 4
  out_chans: 4           # block_len(1) * data_chans(4)
  lr:  0.0008
  max_epochs: 100
  batch_size: 24
  two_step_training: !!bool True
  use_tremor: !!bool True
  pretrained_ckpt_path:  "./Results/cascadia/11/training_checkpoints/backbone.ckpt"
  checkpoint_path: "./Results/cascadia/22/training_checkpoints/backbone.ckpt"
  best_checkpoint_path: "./Results/cascadia/22/training_checkpoints/best_model.ckpt"
  writer: "./Results/cascadia/22/tensorboard"
