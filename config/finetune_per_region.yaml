_base: &base
  pretrained_ckpt_path: "./Results/multiregion_l2_noembed/00/training_checkpoints/best_model.ckpt"

  ft_regions: ["cascadia", "alaska", "nankai", "newzealand"]

  keep_adapters: !!bool True

  lr: 0.0005
  max_epochs: 40
  early_stopping_patience: 8

  out_dir: "./Results/multiregion_l2_noembed/finetune_per_region"
  tb_dir: "./Results/multiregion_l2_noembed/finetune_per_region/tensorboard"

l2:
  <<: *base
  loss_mode: "l2"

l1:
  <<: *base
  loss_mode: "l1"
